<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Info - AJAX Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b2b3b, #1a2a3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        h2 {
            text-align: center;
            color: #ffd966;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        button {
            width: 100%;
            background: #ffb347;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: #1e2f3a;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ff9f1c;
            transform: scale(1.02);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 159, 28, 0.4);
        }

        .result {
            margin-top: 25px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            border-left: 8px solid #ffb347;
        }

        .result p {
            margin: 12px 0;
            font-size: 1rem;
            color: #1e2f3a;
        }

        .result strong {
            display: inline-block;
            width: 110px;
            color: #e67e22;
        }

        .loading {
            text-align: center;
            color: #ecf0f1;
            margin-top: 15px;
            font-style: italic;
        }

        .error {
            background: #c0392b;
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>📘 Student Information System</h2>
    <button id="fetchBtn">✨ Fetch Student Data ✨</button>
    <div id="output" class="result"></div>
</div>

<script src="ajax.js"></script>
</body>
</html>
