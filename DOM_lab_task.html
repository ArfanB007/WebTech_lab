<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Lab Task</title>
    <link rel="stylesheet" href="Dom_Lab.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        
        
        <form id="student-form" class="form-container">
            <div class="form-group">
                <label for="roll-no">Roll No.:</label>
                <input type="text" id="roll-no" placeholder="Enter roll number" required>
            </div>
            
            <div class="form-group">
                <label for="student-name">Student Name:</label>
                <input type="text" id="student-name" placeholder="Enter student name" required>
            </div>
            
            <button type="submit" id="add-btn">Add Student</button>
        </form>

        
        <div class="controls">
            <input type="text" id="search-input" placeholder="🔍 Search students by name or roll...">
            
            <div class="action-buttons">
                <button id="sort-btn">📋 Sort A–Z</button>
                <button id="highlight-btn">⭐ Highlight First Student</button>
            </div>
        </div>

        
        <h2>📝 Student List</h2>
        <ul id="student-list">
            
        </ul>

        
        <div class="stats">
            <p id="total-students">Total students: 0</p>
            <p id="present-count">Present: 0, Absent: 0</p>
        </div>
    </div>

    <script src="Dom_lab.js"></script>
</body>
</html>
