<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Task 04: HTML Form with CSS</title>
    
    <link rel="stylesheet" href="Style_1.css">
  
    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }

        h1 {
            color: darkblue;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightgray;
            padding: 10px;
        }

        p {
            font-size: 16px;
            font-family: Verdana, sans-serif;
            text-align: center;
        }

        .highlight {
            background-color: yellow;
            color: black;
            font-weight: bold;
        }

        #mainTitle {
            text-decoration: underline;
            text-transform: uppercase;
        }

        fieldset {
            border: 2px solid #ccc;
            margin: 10px 0;
            padding: 15px;
        }

        legend {
            font-weight: bold;
            color: darkgreen;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
   
    <h1 id="mainTitle">Student Registration Form</h1>
    
    <p class="highlight">Please fill in the details carefully.</p>

    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob"><br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
        </fieldset>

        <fieldset>
            <legend>Academic Information</legend>
            
            <label for="department">Department:</label>
            <select id="department" name="department">
                <option value="cse">Computer Science</option>
                <option value="se">Software Engineering</option>
                <option value="is">Information Systems</option>
            </select><br><br>

            <label>Skills:</label>
            <input type="checkbox" id="html" name="skills" value="html">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="skills" value="css">
            <label for="css">CSS</label>
            <input type="checkbox" id="js" name="skills" value="js">
            <label for="js">JavaScript</label><br><br>
        </fieldset>

        
        <input type="submit" value="Submit" style="background-color: orange; color: black; font-weight: bold; border-radius: 5px;">
        <input type="reset" value="Reset">
    </form>
    <hr>
    <p>&copy; All Rights Reserved |AIUB|</p>
    <p>Developed by Arfan Nehal</p>
</body>
</html>
